  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully support browser extension fetch interceptors and isolate extension errors
      (function() {
        try {
          let activeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get() {
              return activeFetch;
            },
            set(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (event.filename && (event.filename.includes('chrome-extension://') || event.filename.includes('moz-extension://'))) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
